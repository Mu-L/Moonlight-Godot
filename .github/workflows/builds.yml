name: Build Moonlight GDExtension (Standardized)

on:
  push:
    branches: ["vcpkg"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target-type: [template_release, template_debug]
        target:
          - { platform: linux, arch: x86_64, os: ubuntu-22.04 }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm }
          - { platform: windows, arch: x86_64, os: windows-latest }
          - { platform: macos, arch: x86_64, os: macos-latest }
          - { platform: macos, arch: arm64, os: macos-latest }
          - { platform: ios, arch: arm64, os: macos-latest }
          - { platform: android, arch: arm64, os: ubuntu-24.04 }
          - { platform: android, arch: x86_64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.target.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 实验性：使用GitHub dependency graph
      VCPKG_FEATURE_FLAGS: dependencygraph
      
      # VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      # nuget vcpkg缓存
      USERNAME: ${{ github.repository_owner }}
      VCPKG_EXE: "[ String.raw`${{ github.workspace }}/vcpkg/vcpkg` ]"
      FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json,readwrite"

    steps:
      # ——环境初始化——
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix CMakeLists Case (Force)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # 使用 -iname (不区分大小写) 查找并重命名为标准的 CMakeLists.txt
          # 这样无论它是 CmakeLists.txt 还是 cmakelists.txt 都能被修复
          FILENAME=$(find . -maxdepth 1 -iname "cmakelists.txt" -print -quit)
          if [ -n "$FILENAME" ] && [ "$FILENAME" != "./CMakeLists.txt" ]; then
            echo "Renaming $FILENAME to ./CMakeLists.txt"
            mv "$FILENAME" CMakeLists.txt
          fi

          # 同时检查是否有 vcpkg.json 的大小写问题
          VCPKG_JSON=$(find . -maxdepth 1 -iname "vcpkg.json" -print -quit)
          if [ -n "$VCPKG_JSON" ] && [ "$VCPKG_JSON" != "./vcpkg.json" ]; then
            mv "$VCPKG_JSON" vcpkg.json
          fi
      
      - name: Set Environment Variables
        shell: bash
        run: |
          # 映射 Triplet
          case "${{ matrix.target.platform }}-${{ matrix.target.arch }}" in
            "linux-x86_64")   T="x64-linux" ;;
            "linux-arm64")    T="arm64-linux" ;;
            "windows-x86_64") T="x64-windows" ;;
            "macos-x86_64")   T="x64-osx";  echo "CMAKE_OSX_ARCHITECTURES=x86_64" >> $GITHUB_ENV ;;
            "macos-arm64")    T="arm64-osx"; echo "CMAKE_OSX_ARCHITECTURES=arm64" >> $GITHUB_ENV ;;
            "ios-arm64")      T="arm64-ios" ;;
            "android-x86_64") T="x64-android"; echo "ANDROID_ABI=x86_64" >> $GITHUB_ENV ;;
            "android-arm64")  T="arm64-android"; echo "ANDROID_ABI=arm64-v8a" >> $GITHUB_ENV ;;
          esac
          echo "VCPKG_DEFAULT_TRIPLET=$T" >> $GITHUB_ENV

      # ——准备编译工具——
      # 安装系统编译器依赖
      - name: Install System Dependencies
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y nasm
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install nasm
          fi

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Android NDK
        if: ${{ matrix.target.platform == 'android'}}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      # - name: Restore Project Build Cache
      #   id: build-cache-restore
      #   uses: actions/cache/restore@v4
      #   with:
      #     path: ${{ github.workspace }}/vcpkg_cache
      #     key: ${{ runner.os }}-build-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      # ——构建——
      # --- 初始化 vcpkg (不手动 checkout，让 Action 管理) ---
      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      # --- 使用 run-cmake 执行规范化构建 ---
      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: "${{ matrix.target.platform }}"
          buildPreset: "${{ matrix.target.platform }}"
          # 通过额外参数处理 Release/Debug
          configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}']"
          buildPresetAdditionalArgs: "['--config ${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}']"

      # - name: Save vcpkg cache
      #   uses: actions/cache/save@v4
      #   if: always()
      #   with:
      #     path: ${{ github.workspace }}/vcpkg_cache
      #     key: ${{ runner.os }}-build-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      # ——产物处理——
      - name: Windows - Cleanup
        if: matrix.target.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path bin) { 
            Get-ChildItem bin/* -Include *.exp,*.lib,*.pdb -Recurse | Remove-Item -Force 
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdext-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: bin/
