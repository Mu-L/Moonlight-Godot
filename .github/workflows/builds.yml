name: Build Moonlight GDExtension

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target.platform }} ${{ matrix.target.arch }} ${{ matrix.target-type }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Linux
          - { platform: linux, arch: x86_64, os: ubuntu-22.04, ffmpeg_arch: linux64 }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm, ffmpeg_arch: linuxarm64 }
          # Windows
          - { platform: windows, arch: x86_64, os: windows-latest, ffmpeg_arch: win64 }
          # Android
          - { platform: android, arch: arm64, os: ubuntu-24.04-arm, ffmpeg_arch: linuxarm64 }
          - { platform: android, arch: x86_64, os: ubuntu-22.04, ffmpeg_arch: linux64 }
          # macOS/iOS (Reserved for completeness based on script logic)
          # - { platform: macos, arch: universal, os: macos-latest, ffmpeg_arch: macos64 }
        target-type: [template_debug, template_release]
        float-precision: [single] # Assuming standard single precision
        use_mbedtls: [false]

    defaults:
      run:
        shell: bash

    steps:
      # 1. Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Setup Python & SCons
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install SCons and Requests
        run: pip install scons requests

      # 3. Platform Dependencies (Linux)
      - name: Install Linux Dependencies
        run: |
          if [[ "${{ matrix.target.platform }}" == "linux" ]]; then
            sudo apt-get update && sudo apt-get install -y libmbedtls-dev libssl-dev libevent-dev libffi-dev libgcrypt20-dev
          elif [[ "${{ matrix.target.platform }}" == "android" ]]; then
            sudo apt-get update && sudo apt-get install -y libmbedtls-dev libssl-dev libevent-dev libffi-dev libgcrypt20-dev

      # 4. Platform Dependencies (Windows - OpenSSL)
      - name: Install OpenSSL (Windows)
        if: matrix.target.platform == 'windows' && matrix.use_mbedtls == false
        shell: pwsh
        run: |
          $url = "https://slproweb.com/download/Win64OpenSSL-1_1_1w.exe"
          Invoke-WebRequest -Uri $url -OutFile openssl.exe
          Start-Process -FilePath .\openssl.exe -ArgumentList "/silent","/verysilent" -Wait
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8


      # 6. Setup Godot-CPP
      - name: Setup godot-cpp
        uses: ./src/lib/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      # 7. Download FFmpeg Static Libs
      - name: Download FFmpeg
        run: |
          FFMPEG_ARCH=${{ matrix.target.ffmpeg_arch }}
          TARGET_DIR="src/lib/ffmpeg/$FFMPEG_ARCH"
          python ffmpeg-down.py $FFMPEG_ARCH $TARGET_DIR
          
          if [ ! -d "$TARGET_DIR/lib" ]; then
              echo "Error: FFmpeg download failed or structure invalid."
              exit 1
          fi

      # 8. Cache Restore (.scons_cache)
      - name: Restore SCons Cache
        uses: ./src/lib/godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      # 9. Build GDExtension
      - name: Build with SCons
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          # Arch Handling for Universal
          ARCH=${{ matrix.target.arch }}
          if [ "$ARCH" == "universal" ]; then ARCH="x86_64"; fi
          
          # OpenSSL Env for Windows
          if [ "${{ matrix.target.platform }}" == "windows" ]; then
             export OPENSSL_ROOT_DIR="C:\Program Files\OpenSSL-Win64"
          fi

          scons target=${{ matrix.target-type }} \
                platform=${{ matrix.target.platform }} \
                arch=$ARCH \
                precision=${{ matrix.float-precision }} \
                use_mbedtls=${{ matrix.use_mbedtls }}

      # 10. Cache Save (.scons_cache)
      - name: Save SCons Cache
        uses: ./src/lib/godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

      # 11. Artifact Upload
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdext-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: bin/

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: moonlight-gdextension-all
          pattern: moonlight-gdext-*
          delete-merged: true