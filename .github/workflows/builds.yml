name: Build Moonlight GDExtension (CMake + vcpkg)

on:
  push:
    branches: [ "vcpkg" ]
  pull_request:
    branches: [ "vcpkg" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target-type: [template_release, template_debug]
        target:
          - { platform: linux, arch: x86_64, os: ubuntu-22.04 }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm }
          - { platform: windows, arch: x86_64, os: windows-latest }
          - { platform: macos, arch: x86_64, os: macos-latest }
          - { platform: macos, arch: arm64, os: macos-latest }
          - { platform: ios, arch: arm64, os: macos-latest }
          - { platform: android, arch: arm64, os: ubuntu-24.04 }
          - { platform: android, arch: x86_64, os: ubuntu-22.04 }

    runs-on: ${{ matrix.target.os }}
    
    env:
      VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite' # 强制 run-vcpkg 使用 GitHub Actions 缓存后端

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 修正 Linux 下 CMakeLists.txt 的文件名大小写问题
      - name: Fix CMakeLists Filename Case (Linux/Android)
        if: runner.os != 'Windows'
        run: |
          if [ -f "CmakeLists.txt" ]; then
            mv CmakeLists.txt CMakeLists.txt
          fi

      # 安装系统编译器依赖
      - name: Install System Dependencies
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y nasm
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install nasm
          fi

      # 使用模块获取最新版 CMake 和 Ninja
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      # 设置 vcpkg Triplet 变量
      - name: Set vcpkg triplet
        id: set_triplet
        shell: bash
        run: |
          case "${{ matrix.target.platform }}-${{ matrix.target.arch }}" in
            "linux-x86_64")   T="x64-linux" ;;
            "linux-arm64")    T="arm64-linux" ;;
            "windows-x86_64") T="x64-windows" ;;
            "macos-x86_64")   T="x64-osx" ;;
            "macos-arm64")    T="arm64-osx" ;;
            "ios-arm64")      T="arm64-ios" ;;
            "android-x86_64") T="x64-android" ;;
            "android-arm64")  T="arm64-android" ;;
          esac
          echo "triplet=$T" >> $GITHUB_OUTPUT
          echo "VCPKG_DEFAULT_TRIPLET=$T" >> $GITHUB_ENV

      # 使用 lukka/run-vcpkg 处理 vcpkg 安装与二进制缓存
      # 它会自动处理 bootstrap 和缓存同步
      - name: Run vcpkg to install dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: 'master' # 如果不是 submodule，指定 commit
          runVcpkgInstall: true
          # 传递环境变量，确保 vcpkg 知道我们要编哪个平台
          vcpkgJsonGlob: '**/vcpkg.json'

      # 设置 Android NDK (保持您的自定义下载逻辑)
      - name: Setup Android NDK
        if: matrix.target.platform == 'android'
        shell: bash
        run: |
          if [[ "${{ matrix.target.arch }}" == "arm64" ]]; then
            NDK_VER="r28c"
            NDK_FILENAME="android-ndk-${NDK_VER}-aarch64-linux-musl.tar.xz"
            DOWNLOAD_URL="https://github.com/HomuHomu833/android-ndk-custom/releases/download/r28/${NDK_FILENAME}"
            NDK_INSTALL_DIR="$HOME/ndk-custom"
            mkdir -p "${NDK_INSTALL_DIR}"
            curl -L "${DOWNLOAD_URL}" -o "${NDK_INSTALL_DIR}/${NDK_FILENAME}"
            tar -xf "${NDK_INSTALL_DIR}/${NDK_FILENAME}" -C "${NDK_INSTALL_DIR}"
            NDK_PATH=$(find "${NDK_INSTALL_DIR}" -maxdepth 1 -type d -name "android-ndk-r*" -print -quit)
            echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          else
            # x86_64 使用标准 NDK
            echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.0.12433566" >> $GITHUB_ENV
          fi

      # 针对项目本身的构建缓存 (Build Cache)
      - name: Restore Project Build Cache
        id: build-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: build-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          key: ${{ runner.os }}-build-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}

      # 配置与构建
      - name: Configure and Build Project
        shell: bash
        run: |
          BUILD_DIR="build-${{ matrix.target.platform }}-${{ matrix.target.arch }}"
          CMAKE_ARGS=(
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
            -DVCPKG_TARGET_TRIPLET="${{ steps.set_triplet.outputs.triplet }}"
            -DCMAKE_BUILD_TYPE=${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}
            -G Ninja
          )
          
          if [[ "${{ matrix.target.platform }}" == "android" ]]; then
            CMAKE_ARGS+=(
              -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
              -DANDROID_ABI="${{ matrix.target.arch == 'arm64' && 'arm64-v8a' || 'x86_64' }}"
              -DANDROID_PLATFORM=android-21
            )
          elif [[ "${{ matrix.target.platform }}" == "ios" ]]; then
            CMAKE_ARGS+=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0)
          elif [[ "${{ matrix.target.platform }}" == "macos" ]]; then
            CMAKE_ARGS+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.target.arch }})
          fi

          # 1. 配置 (明确指定源码位置)
          cmake -S . -B "$BUILD_DIR" "${CMAKE_ARGS[@]}"
          
          # 2. 构建
          cmake --build "$BUILD_DIR" --parallel --config ${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}
          
          # 3. 安装
          cmake --install "$BUILD_DIR" --config ${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}

      # 保存项目构建缓存 (即便失败也尝试保存)
      - name: Save Project Build Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          key: ${{ steps.build-cache-restore.outputs.cache-primary-key }}

      # 清理并上传产物
      - name: Windows - Cleanup PDBs
        if: matrix.target.platform == 'windows' && success()
        shell: pwsh
        run: if (Test-Path bin) { Get-ChildItem bin/* -Include *.exp,*.lib,*.pdb -Recurse | Remove-Item -Force }

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdext-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: bin/

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: moonlight-gdext-*
          merge-multiple: true

      - name: Upload Final Merged Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdextension-all
          path: downloaded-artifacts/