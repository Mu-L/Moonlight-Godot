name: Build Moonlight GDExtension

on:
  push:
    branches: ["vcpkg"]
  workflow_dispatch:
    inputs:
      force_refresh_cache:
        description: "Force Refresh Cache"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target-type: [template_release, template_debug]
        target:
          - { platform: linux, arch: x86_64, os: ubuntu-22.04 }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm }
          - { platform: windows, arch: x86_64, os: windows-latest }
          - { platform: macos, arch: x86_64, os: macos-latest }
          - { platform: macos, arch: arm64, os: macos-latest }
          - { platform: ios, arch: arm64, os: macos-latest }
          - { platform: android, arch: arm64, os: ubuntu-24.04 }
          - { platform: android, arch: x86_64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.target.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 实验性：使用GitHub dependency graph
      VCPKG_FEATURE_FLAGS: dependencygraph
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite

    steps:
      # ——环境初始化——
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record Build Start Time
        shell: bash
        run: |
          echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Fix CMakeLists Case
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # 使用 -iname (不区分大小写) 查找并重命名为标准的 CMakeLists.txt
          # 这样无论它是 CmakeLists.txt 还是 cmakelists.txt 都能被修复
          FILENAME=$(find . -maxdepth 1 -iname "cmakelists.txt" -print -quit)
          if [ -n "$FILENAME" ] && [ "$FILENAME" != "./CMakeLists.txt" ]; then
            echo "Renaming $FILENAME to ./CMakeLists.txt"
            mv "$FILENAME" CMakeLists.txt
          fi

          # 同时检查是否有 vcpkg.json 的大小写问题
          VCPKG_JSON=$(find . -maxdepth 1 -iname "vcpkg.json" -print -quit)
          if [ -n "$VCPKG_JSON" ] && [ "$VCPKG_JSON" != "./vcpkg.json" ]; then
            mv "$VCPKG_JSON" vcpkg.json
          fi

      - name: Set Environment Variables
        shell: bash
        run: |
          # 映射 Triplet
          case "${{ matrix.target.platform }}-${{ matrix.target.arch }}" in
            "linux-x86_64")   T="x64-linux" ;;
            "linux-arm64")    T="arm64-linux" ;;
            "windows-x86_64") T="x64-windows-static" ;;
            "macos-x86_64")   T="x64-osx";  echo "CMAKE_OSX_ARCHITECTURES=x86_64" >> $GITHUB_ENV ;;
            "macos-arm64")    T="arm64-osx"; echo "CMAKE_OSX_ARCHITECTURES=arm64" >> $GITHUB_ENV ;;
            "ios-arm64")      T="arm64-ios" ;;
            "android-x86_64") 
              T="x64-android"
              echo "ANDROID_ABI=x86_64" >> $GITHUB_ENV
              # 必须与 vcpkg triplet (VCPKG_CMAKE_SYSTEM_VERSION 28) 保持一致
              echo "ANDROID_PLATFORM=android-28" >> $GITHUB_ENV
              echo "ANDROID_NATIVE_API_LEVEL=28" >> $GITHUB_ENV
              ;;
            "android-arm64")  
              T="arm64-android"
              echo "ANDROID_ABI=arm64-v8a" >> $GITHUB_ENV
              # 必须与 vcpkg triplet (VCPKG_CMAKE_SYSTEM_VERSION 28) 保持一致
              echo "ANDROID_PLATFORM=android-28" >> $GITHUB_ENV
              echo "ANDROID_NATIVE_API_LEVEL=28" >> $GITHUB_ENV
              ;;
          esac
          echo "VCPKG_DEFAULT_TRIPLET=$T" >> $GITHUB_ENV

          # 导出为环境变量，以便 CMake 备选
          echo "GODOTCPP_SUFFIX=.${{ matrix.target.platform }}.${{ matrix.target-type }}.${{ matrix.target.arch }}" >> $GITHUB_ENV

      # ——准备编译工具——
      # 安装系统编译器依赖
      - name: Install System Dependencies
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y \
              nasm ninja-build build-essential \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              libatomic1-arm64-cross libdrm-dev \
              pkg-config libx11-dev libxext-dev libxfixes-dev libxcb1-dev libgl1-mesa-dev libva-dev libvdpau-dev libvulkan-dev
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install nasm ninja
          fi

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Android NDK
        if: ${{ matrix.target.platform == 'android'}}
        uses: nttld/setup-ndk@v1
        with:
          # 使用 LTS 版本 r27c 以避免 beta 版潜在的链接问题
          ndk-version: r27d
          link-to-sdk: true

      # ——构建——
      # --- 初始化 vcpkg (不手动 checkout，让 Action 管理) ---
      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "vcpkg.json"

      - name: Add Platform Specific ffmpeg Features
        shell: bash
        run: |
          FEATURES=()
          PLATFORM="${{ matrix.target.platform }}"
          ARCH="${{ matrix.target.arch }}"
          # nvcodec: linux | (!osx & !uwp & !(arm64 & windows))
          if [[ "$PLATFORM" == "linux" ]] || [[ "$PLATFORM" != "macos" && "$PLATFORM" != "ios" && ! ( "$ARCH" == "arm64" && "$PLATFORM" == "windows" ) ]]; then
            FEATURES+=("nvcodec")
          fi

          # qsv: ((x86 | x64) & (linux | windows))
          if [[ ( "$ARCH" == "x86_64" && ( "$PLATFORM" == "linux" || "$PLATFORM" == "windows" ) ) ]] || [[ "$PLATFORM" == "windows" ]]; then
            FEATURES+=("qsv")
          fi

          # amf: windows | linux
          if [[ "$PLATFORM" == "windows" || "$PLATFORM" == "linux" ]]; then
            FEATURES+=("amf")
          fi

          # x265: !osx
          if [[ "$PLATFORM" != "macos" && "$PLATFORM" != "ios" && "$ARCH" != "arm64" ]]; then
            FEATURES+=("x265")
          fi

          # vaapi: linux
          if [[ "$PLATFORM" == "linux" ]]; then
            FEATURES+=("vaapi")
          fi
            
          # vulkan: linux & windows
          if [[ "$PLATFORM" == "linux" || "$PLATFORM" == "windows" || "$PLATFORM" == "android" ]]; then
            FEATURES+=("vulkan")
          fi

          if [[ "$PLATFORM" == "android" ]]; then
            FEATURES=()
          fi
          # x264: !android
          if [[ "$PLATFORM" != "android" ]]; then
            FEATURES+=("x264")
          fi

          if [ ${#FEATURES[@]} -gt 0 ]; then
            IFS=','
            FEATURE_STR="${FEATURES[*]}"
            echo "Adding features: $FEATURE_STR"
            vcpkg add port "ffmpeg[$FEATURE_STR]"
          fi

      - name: Restore vcpkg Cache
        id: build-cache-restore
        # Skip restore if force_refresh_cache is true
        if: ${{ !inputs.force_refresh_cache }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ runner.os }}-build-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: "${{ matrix.target.platform }}"
          buildPreset: "${{ matrix.target.platform }}"
          # 关键：将 API Level 统一提升至 28 以匹配 vcpkg 依赖库
          configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}', '-DANDROID_NATIVE_API_LEVEL=28', '-DANDROID_ABI=${{ env.ANDROID_ABI }}', '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-28', '-DGODOTCPP_SUFFIX=.${{ matrix.target.platform }}.${{ matrix.target-type }}.${{ matrix.target.arch }}']"
          # build 阶段不应携带 -D 参数
          buildPresetAdditionalArgs: "['--config ${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}']"

      - name: Delete existing Cache if needed
        if: always() && matrix.target-type == 'template_debug'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CACHE_KEY="${{ runner.os }}-build-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}"
          if [ "${{ inputs.force_refresh_cache || 'false' }}" == "true" ] || [ "${{ steps.build-cache-restore.outputs.cache-hit }}" == "true" ]; then
            echo "Deleting existing cache to allow update..."
            gh extension install actions/gh-actions-cache || true
            gh actions-cache delete "$CACHE_KEY" -R $GITHUB_REPOSITORY --confirm || echo "Cache deletion did not succeed or cache did not exist"
          fi

      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        if: always() && matrix.target-type == 'template_debug'
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ runner.os }}-build-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      # ——产物处理——
      - name: Windows - Cleanup
        if: matrix.target.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path bin) { 
            Get-ChildItem bin/* -Include *.exp,*.lib,*.pdb -Recurse | Remove-Item -Force 
          }

      - name: Prepare Output Directory
        shell: bash
        run: |
          mkdir -p package/addons/moonlight-godot/bin
          # Use find to copy without case sensitivity issues if needed, or check path carefully
          cp -r bin/* package/addons/moonlight-godot/bin/
          
          # Fix: find the gdextension file case-insensitively just in case
          GDEXT_PATH=$(find demo/addons/moonlight-godot/bin -maxdepth 1 -iname "moonlight-godot.gdextension" | head -n 1)
          if [ -z "$GDEXT_PATH" ]; then
            echo "Error: .gdextension file not found in demo/addons/moonlight-godot/bin"
            ls -R demo/addons/moonlight-godot/bin
            exit 1
          fi
          cp "$GDEXT_PATH" package/addons/moonlight-godot/bin/moonlight-godot.gdextension

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdext-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: package/

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: moonlight-gdext-*
          merge-multiple: true

      - name: Upload Final Merged Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-godot-plugin
          path: downloaded-artifacts/

      - name: Prepare Demo Artifact
        shell: bash
        run: |
          # The downloaded artifacts represent the additions to demo/
          # Copy everything from downloaded-artifacts (addons/... etc) into demo/
          cp -r downloaded-artifacts/* demo/

      - name: Upload Final Merged Artifact - Demo Version
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-godot-demo
          path: demo/

      - name: Parse Release Metadata
        id: parse_meta
        run: |
          COMMIT_MSG=$(git log -1 --format=%B)
          python3 << 'EOF' "$COMMIT_MSG"
          import re, os, sys
          msg = sys.argv[1].strip()
          pattern = r'\[release ver=([^,\]]+)(?:,pre=(true|false))?(?:,draft=(true|false))?\]'
          match = re.search(pattern, msg)
          env_file = os.environ['GITHUB_ENV']
          if match:
              ver, pre, draft = match.group(1), match.group(2) or "false", match.group(3) or "false"
              clean_msg = msg.replace(match.group(0), "").strip()
              with open(env_file, 'a') as f:
                  f.write(f"SHOULD_RELEASE=true\nREL_VERSION={ver}\nREL_PRE={pre}\nREL_DRAFT={draft}\n")
              with open('RELEASE_BODY.md', 'w') as f:
                  f.write(f"{clean_msg}\n\n**Commit:** https://github.com/{os.environ['GITHUB_REPOSITORY']}/commit/{os.environ['GITHUB_SHA']}\n")
              
              # Update project.godot version
              godot_file = "demo/project.godot"
              if os.path.exists(godot_file):
                  with open(godot_file, "r", encoding="utf-8") as f:
                      content = f.read()
                  new_content = re.sub(r'(config/version\s*=\s*")[^"]+(")', rf'\1{ver}\2', content)
                  with open(godot_file, "w", encoding="utf-8") as f:
                      f.write(new_content)
          else:
              with open(env_file, 'a') as f:
                  f.write("SHOULD_RELEASE=false\n")
          EOF

      - name: Create GitHub Release
        if: env.SHOULD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Packaging release ZIPs..."
          # Pack main plugin and demo
          zip -qr moonlight-godot-plugin.zip downloaded-artifacts/*
          zip -qr moonlight-godot-demo.zip demo/*
          
          # Pack per-platform-arch artifacts
          # The downloaded-artifacts/addons/moonlight-godot/bin/<platform>/ contains the libraries
          # We need to extract the platform and arch from the filenames to create clear zip names
          mkdir -p platform-zips
          
          # Use python to group files by platform/arch more intelligently
          python3 << 'EOF'
          import os, zipfile, re
          
          base_dir = "downloaded-artifacts/addons/moonlight-godot/bin"
          output_dir = "platform-zips"
          gdext_file = os.path.join(base_dir, "moonlight-godot.gdextension")
          
          # Patterns to find platform/arch in filenames (e.g. .windows.template_release.x86_64)
          # Format: .<platform>.<type>.<arch>
          pattern = re.compile(r'\.([a-z]+)\.(?:template_release|template_debug)\.([a-z0-9_]+)')
          
          groups = {} # key: (platform, arch), value: list of file paths
          
          for root, dirs, files in os.walk(base_dir):
              for f in files:
                  if f.endswith('.gdextension') or f.endswith('.uid'): continue
                  match = pattern.search(f)
                  if match:
                      platform, arch = match.groups()
                      key = (platform, arch)
                      if key not in groups: groups[key] = []
                      groups[key].append(os.path.join(root, f))
          
          for (platform, arch), file_paths in groups.items():
              zip_name = f"moonlight-godot-{platform}-{arch}.zip"
              zip_path = os.path.join(output_dir, zip_name)
              print(f"Creating {zip_name}...")
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as z:
                  # Add the binaries maintaining their relative structure from addons/
                  for fp in file_paths:
                      arcname = os.path.relpath(fp, "downloaded-artifacts")
                      z.write(fp, arcname)
                  # Add the gdextension file
                  z.write(gdext_file, "addons/moonlight-godot/bin/moonlight-godot.gdextension")
          EOF
          
          echo "Creating release v${{ env.REL_VERSION }}..."
          ARGS=()
          if [ "${{ env.REL_PRE }}" = "true" ]; then ARGS+=("--prerelease"); fi
          if [ "${{ env.REL_DRAFT }}" = "true" ]; then ARGS+=("--draft"); fi
          
          gh release create "v${{ env.REL_VERSION }}" \
            --title "Release V${{ env.REL_VERSION }}" \
            --notes-file RELEASE_BODY.md \
            "${ARGS[@]}" \
            moonlight-godot-plugin.zip \
            moonlight-godot-demo.zip \
            platform-zips/*.zip

