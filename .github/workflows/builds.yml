name: Build Moonlight GDExtension

on:
  push:
    branches: ["vcpkg"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target-type: [template_release, template_debug]
        target:
          - { platform: linux, arch: x86_64, os: ubuntu-22.04 }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm }
          - { platform: windows, arch: x86_64, os: windows-latest }
          - { platform: macos, arch: x86_64, os: macos-latest }
          - { platform: macos, arch: arm64, os: macos-latest }
          - { platform: ios, arch: arm64, os: macos-latest }
          - { platform: android, arch: arm64, os: ubuntu-24.04 }
          - { platform: android, arch: x86_64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.target.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 实验性：使用GitHub dependency graph
      VCPKG_FEATURE_FLAGS: dependencygraph
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      
    steps:
      # ——环境初始化——
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fix CMakeLists Case
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # 使用 -iname (不区分大小写) 查找并重命名为标准的 CMakeLists.txt
          # 这样无论它是 CmakeLists.txt 还是 cmakelists.txt 都能被修复
          FILENAME=$(find . -maxdepth 1 -iname "cmakelists.txt" -print -quit)
          if [ -n "$FILENAME" ] && [ "$FILENAME" != "./CMakeLists.txt" ]; then
            echo "Renaming $FILENAME to ./CMakeLists.txt"
            mv "$FILENAME" CMakeLists.txt
          fi

          # 同时检查是否有 vcpkg.json 的大小写问题
          VCPKG_JSON=$(find . -maxdepth 1 -iname "vcpkg.json" -print -quit)
          if [ -n "$VCPKG_JSON" ] && [ "$VCPKG_JSON" != "./vcpkg.json" ]; then
            mv "$VCPKG_JSON" vcpkg.json
          fi
      
      - name: Set Environment Variables
        shell: bash
        run: |
          # 映射 Triplet
          case "${{ matrix.target.platform }}-${{ matrix.target.arch }}" in
            "linux-x86_64")   T="x64-linux" ;;
            "linux-arm64")    T="arm64-linux" ;;
            "windows-x86_64") T="x64-windows-static-md" ;;
            "macos-x86_64")   T="x64-osx";  echo "CMAKE_OSX_ARCHITECTURES=x86_64" >> $GITHUB_ENV ;;
            "macos-arm64")    T="arm64-osx"; echo "CMAKE_OSX_ARCHITECTURES=arm64" >> $GITHUB_ENV ;;
            "ios-arm64")      T="arm64-ios" ;;
            "android-x86_64") 
              T="x64-android"
              echo "ANDROID_ABI=x86_64" >> $GITHUB_ENV
              ;;
            "android-arm64")  
              T="arm64-android"
              echo "ANDROID_ABI=arm64-v8a" >> $GITHUB_ENV
              ;;
          esac
          echo "VCPKG_DEFAULT_TRIPLET=$T" >> $GITHUB_ENV
          # 导出为环境变量，以便 CMake 备选
          echo "GODOTCPP_SUFFIX=.${{ matrix.target.platform }}.${{ matrix.target-type }}.${{ matrix.target.arch }}" >> $GITHUB_ENV

      # ——准备编译工具——
      # 安装系统编译器依赖
      - name: Install System Dependencies
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y \
              nasm ninja-build build-essential \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              libatomic1-arm64-cross
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install nasm ninja
          fi

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
        
      - name: Setup Android NDK 
        if: ${{ matrix.target.platform == 'android'}}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      # ——构建——
      # --- 初始化 vcpkg (不手动 checkout，让 Action 管理) ---
      - name: Run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json' 

      - name: Add Platform Specific ffmpeg Features
        shell: bash
        run: |
          FEATURES=()
          PLATFORM="${{ matrix.target.platform }}"
          ARCH="${{ matrix.target.arch }}"
          
          # nvcodec: linux | (!osx & !uwp & !(arm64 & windows))
          if [[ "$PLATFORM" == "linux" ]] || [[ "$PLATFORM" != "macos" && "$PLATFORM" != "ios" && ! ("$ARCH" == "arm64" && "$PLATFORM" == "windows") ]]; then
            FEATURES+=("nvcodec")
          fi

          # qsv: ((x86 | x64) & (android | linux)) | (windows & !uwp)
          if [[ ("$ARCH" == "x86_64" && ("$PLATFORM" == "android" || "$PLATFORM" == "linux")) ]] || [[ "$PLATFORM" == "windows" ]]; then
            FEATURES+=("qsv")
          fi

          # amf: !osx
          if [[ "$PLATFORM" != "macos" && "$PLATFORM" != "ios" ]]; then
            FEATURES+=("amf")
          fi

          # x265: !osx
          if [[ "$PLATFORM" != "macos" && "$PLATFORM" != "ios" && "$ARCH" != "arm64" ]]; then
          FEATURES+=("x265")
          fi
          
          # android
          if [ "$PLATFORM" == "android" ]; then
          FEATURES=()
          fi
          
          if [ ${#FEATURES[@]} -gt 0 ]; then
            IFS=','
            FEATURE_STR="${FEATURES[*]}"
            echo "Adding features: $FEATURE_STR"
            vcpkg add port "ffmpeg[$FEATURE_STR]"
          fi

      - name: Restore Project Build Cache
        id: build-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ runner.os }}-build-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Restore CMake Build Cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-

      - name: Run CMake
        uses: lukka/run-cmake@v10
        with:
          configurePreset: "${{ matrix.target.platform }}"
          buildPreset: "${{ matrix.target.platform }}"
          # 关键：所有 -D 参数必须在 configure 阶段传递
          configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}', '-DANDROID_NATIVE_API_LEVEL=24', '-DANDROID_ABI=${{ env.ANDROID_ABI }}', '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-24', '-DGODOTCPP_SUFFIX=.${{ matrix.target.platform }}.${{ matrix.target-type }}.${{ matrix.target.arch }}']"
          # build 阶段不应携带 -D 参数
          buildPresetAdditionalArgs: "['--config ${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}']"

      - name: Save CMake Build Cache
        uses: actions/cache/save@v4
        with:
          path: build
          key: ${{ runner.os }}-cmake-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-${{ github.sha }}

      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        if: matrix.target-type== 'template_debug'
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ runner.os }}-build-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      # ——产物处理——
      - name: Windows - Cleanup
        if: matrix.target.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path bin) { 
            Get-ChildItem bin/* -Include *.exp,*.lib,*.pdb -Recurse | Remove-Item -Force 
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdext-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: bin/

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: moonlight-gdext-*
          merge-multiple: true

      - name: Upload Final Merged Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdextension-all
          path: downloaded-artifacts/