name: Build Moonlight GDExtension (CMake + vcpkg)

on:
  push:
    branches: [ "vcpkg" ]
  pull_request:
    branches: [ "vcpkg" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target-type: [template_release, template_debug]
        target:
          - { platform: linux, arch: x86_64, os: ubuntu-22.04 }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm }
          - { platform: windows, arch: x86_64, os: windows-latest }
          - { platform: macos, arch: x86_64, os: macos-latest }
          - { platform: macos, arch: arm64, os: macos-latest }
          - { platform: ios, arch: arm64, os: macos-latest }
          - { platform: android, arch: arm64, os: ubuntu-24.04 }
          - { platform: android, arch: x86_64, os: ubuntu-22.04 }

    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      # --- 1. 设置 vcpkg 环境 ---
      - name: Setup vcpkg
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          path: vcpkg
          ref: master

      - name: Bootstrap vcpkg
        run: |
          if [[ "${{ matrix.target.platform }}" == "windows" ]]; then
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Set vcpkg triplet
        id: set_triplet
        run: |
          case "${{ matrix.target.platform }}-${{ matrix.target.arch }}" in
            "linux-x86_64") echo "triplet=x64-linux" >> $GITHUB_OUTPUT ;;
            "linux-arm64") echo "triplet=arm64-linux" >> $GITHUB_OUTPUT ;;
            "windows-x86_64") echo "triplet=x64-windows" >> $GITHUB_OUTPUT ;;
            "macos-x86_64") echo "triplet=x64-osx" >> $GITHUB_OUTPUT ;;
            "macos-arm64") echo "triplet=arm64-osx" >> $GITHUB_OUTPUT ;;
            "ios-arm64") echo "triplet=arm64-ios" >> $GITHUB_OUTPUT ;;
            "android-x86_64") echo "triplet=x64-android" >> $GITHUB_OUTPUT ;;
            "android-arm64") echo "triplet=arm64-android" >> $GITHUB_OUTPUT ;;
            *) echo "triplet=${{ matrix.target.platform }}-${{ matrix.target.arch }}" >> $GITHUB_OUTPUT ;;
          esac

      # --- 2. vcpkg 依赖缓存逻辑 ---
      - name: Restore vcpkg Cache
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-${{ steps.set_triplet.outputs.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ steps.set_triplet.outputs.triplet }}-

      - name: Install vcpkg dependencies
        run: ./vcpkg/vcpkg install --triplet ${{ steps.set_triplet.outputs.triplet }}

      - name: Save vcpkg Cache
        # 仅在恢复失败（缓存未命中）或 vcpkg.json 更改时保存
        if: steps.vcpkg-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            vcpkg/installed
            vcpkg/downloads
          key: ${{ steps.vcpkg-cache-restore.outputs.cache-primary-key }}

      # --- 3. 设置 Android NDK (仅 Android) ---
      - name: Setup Android NDK (x86_64)
        if: ${{ matrix.target.platform == 'android' && matrix.target.arch == 'x86_64' }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true
  
      - name: Setup Android NDK (arm64)
        if: ${{ matrix.target.platform == 'android' && matrix.target.arch == 'arm64' }}
        run: |
          NDK_VER="r28c"
          NDK_FILENAME="android-ndk-${NDK_VER}-aarch64-linux-musl.tar.xz"
          DOWNLOAD_URL="https://github.com/HomuHomu833/android-ndk-custom/releases/download/r28/${NDK_FILENAME}"
          NDK_INSTALL_DIR="$HOME/ndk-custom"
          mkdir -p "${NDK_INSTALL_DIR}"
          curl -L "${DOWNLOAD_URL}" -o "${NDK_INSTALL_DIR}/${NDK_FILENAME}"
          tar -xf "${NDK_INSTALL_DIR}/${NDK_FILENAME}" -C "${NDK_INSTALL_DIR}"
          NDK_ROOT_DIR=$(find "${NDK_INSTALL_DIR}" -maxdepth 1 -type d -name "android-ndk-r*" -print -quit)
          echo "ANDROID_NDK_HOME=${NDK_ROOT_DIR}" >> $GITHUB_ENV

      # --- 4. CMake 构建缓存逻辑 ---
      - name: Restore CMake Build Cache
        id: cmake-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: build-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          key: ${{ runner.os }}-cmake-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ hashFiles('CMakeLists.txt', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-cmake-${{ matrix.target.platform }}-${{ matrix.target.arch }}-

      - name: Configure CMake
        run: |
          BUILD_DIR="build-${{ matrix.target.platform }}-${{ matrix.target.arch }}"
          CMAKE_ARGS=(
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
            -DVCPKG_TARGET_TRIPLET="${{ steps.set_triplet.outputs.triplet }}"
            -DCMAKE_BUILD_TYPE=${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}
          )
          if [[ "${{ matrix.target.platform }}" == "android" ]]; then
            CMAKE_ARGS+=(-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI="${{ matrix.target.arch == 'arm64' && 'arm64-v8a' || 'x86_64' }}" -DANDROID_PLATFORM=android-21)
          elif [[ "${{ matrix.target.platform }}" == "ios" ]]; then
            CMAKE_ARGS+=(-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=${{ matrix.target.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0)
          elif [[ "${{ matrix.target.platform }}" == "macos" ]]; then
            CMAKE_ARGS+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.target.arch }})
          fi
          cmake -S "$GITHUB_WORKSPACE" -B "$BUILD_DIR" "${CMAKE_ARGS[@]}"

      - name: Build with CMake
        run: |
          BUILD_DIR="build-${{ matrix.target.platform }}-${{ matrix.target.arch }}"
          cmake --build "$BUILD_DIR" --parallel --config ${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}

      - name: Save CMake Build Cache
        # 即使 Build 失败也可以考虑保存，以保留已完成的编译单元 (.o/.obj)
        # 也可以设置为仅在成功时保存
        uses: actions/cache/save@v4
        with:
          path: build-${{ matrix.target.platform }}-${{ matrix.target.arch }}
          key: ${{ steps.cmake-cache-restore.outputs.cache-primary-key }}

      # --- 5. 产物处理 ---
      - name: Install and Export
        if: success()
        run: |
          BUILD_DIR="build-${{ matrix.target.platform }}-${{ matrix.target.arch }}"
          cmake --install "$BUILD_DIR" --config ${{ matrix.target-type == 'template_release' && 'Release' || 'Debug' }}

      - name: Windows - Cleanup PDBs
        if: ${{ matrix.target.platform == 'windows' && success() }}
        shell: pwsh
        run: |
          if (Test-Path bin) { Get-ChildItem bin/* -Include *.exp,*.lib,*.pdb -Recurse | Remove-Item -Force }

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdext-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}
          path: bin/

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: moonlight-gdext-*
          merge-multiple: true

      - name: Upload Final Merged Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdextension-all
          path: downloaded-artifacts/