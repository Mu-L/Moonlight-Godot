name: Build Moonlight GDExtension (FFmpeg Static)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target-type: [template_release, template_debug]
        target:
          # 桌面平台
          - { platform: linux, arch: x86_64, os: ubuntu-22.04, ffmpeg_arch: linux64 }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm, ffmpeg_arch: linuxarm64 } 
          - { platform: windows, arch: x86_64, os: windows-latest, ffmpeg_arch: win64 }
          - { platform: android, arch: arm64, os: ubuntu-24.04, ffmpeg_arch: linuxarm64 }
          - { platform: android, arch: x86_64, os: ubuntu-22.04, ffmpeg_arch: linux64 }
        float-precision: [single]
        use_mbedtls: [false]

    runs-on: ${{ matrix.target.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive 

      # --- 依赖安装 (保持原逻辑，并适配移动平台) ---
      # ⚠️ 注意：此处的 MbedTLS 安装依赖于您的 godot-cpp/moonlight-common-c 配置。
      # 必须确保 godot-cpp setup action 及其它步骤已正确安装 Android/iOS 工具链和依赖。
      - name: Setup Python & Install SCons
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install scons requests

      - name: Install MbedTLS&Openssl
        if: ${{ matrix.target.platform != 'windows' }}
        run: |
          if [[ "${{ matrix.target.platform }}" == "linux" ]]; then
            sudo apt-get update && sudo apt-get install -y libmbedtls-dev libssl-dev libevent-dev libffi-dev libgcrypt20-dev
          elif [[ "${{ matrix.target.platform }}" == "android" ]]; then
            sudo apt-get update && sudo apt-get install -y libmbedtls-dev libssl-dev libevent-dev libffi-dev libgcrypt20-dev
          fi

      # Add linux x86_32 toolchain
      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Install OpenSSL for Windows
        if: ${{ matrix.target.platform == 'windows' && matrix.use_mbedtls == false }}
        shell: pwsh
        run: |
          $url = "https://slproweb.com/download/Win64OpenSSL-1_1_1w.exe"
          Invoke-WebRequest -Uri $url -OutFile openssl.exe
          Start-Process -FilePath .\openssl.exe -ArgumentList "/silent","/verysilent" -Wait
          echo "OPENSSL_ROOT_DIR=C:\Program Files\OpenSSL-Win64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
      
          # --- Setup godot-cpp (prebuilt lib) ---
      # 此步骤由用户提供，用于安装工具链和 godot-cpp 预编译库
      - name: Setup godot-cpp (Toolchain/SDKs)
        # if : ${{ matrix.target.platform != 'android' || matrix.target.platform == 'android' && matrix.target.arch == 'x86_64' }}
        uses: ./src/lib/godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62 # 保持原样
      # - name: Setup godot-cpp (Toolchain/SDKs) for Android Arm
      #   if : ${{ matrix.target.platform == 'android' && matrix.target.arch == 'arm64' }} 
      #   uses: ./.github/actions/setup-godot-cpp-arm
      #   with:
      #     platform: ${{ matrix.target.platform }}
      #     em-version: 3.1.62 # 保持原样

      # --- 使用 ffmpeg-down.py 下载和安装 FFmpeg ---
      - name: Download and Install FFmpeg Static Libs
        shell: sh
        run: |
          FFMPEG_ARCH=${{ matrix.target.ffmpeg_arch }}
          TARGET_DIR="src/lib/ffmpeg/$FFMPEG_ARCH"
          set PYTHONIOENCODING=utf-8
          echo "Downloading FFmpeg for $FFMPEG_ARCH to $TARGET_DIR"
          # ❗️ 重要提示：对于 Android/iOS，BtbN 不提供现成的静态库。
          # 您可能需要将此步骤替换为使用自定义脚本或 pre-built artifacts 
          # 来放置对应平台的 FFmpeg 静态库到 $TARGET_DIR 中。
          python ffmpeg-down.py $FFMPEG_ARCH $TARGET_DIR
          
          ls $TARGET_DIR          # 验证下载结果
          if [ ! -d "$TARGET_DIR/lib" ] || [ ! -d "$TARGET_DIR/include" ]; then
              echo "Error: FFmpeg libraries not found in expected path: $TARGET_DIR"
              exit 1
          fi
# 8. Cache Restore (.scons_cache)
      - name: Restore SCons Cache
        uses: ./src/lib/godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}
      # --- Build with SCons (统一构建步骤) ---
      - name: Build GDExtension
        shell: sh
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons-cache/
        run: |
          # SCons 的 arch 参数
          ARCH=${{ matrix.target.arch }}
          if [ "$ARCH" == "universal" ]; then
            ARCH="x86_64" 
          fi
          PLATFORM=${{ matrix.target.platform }}
          if [ "$PLATFORM" == "windows" ]; then
          export OPENSSL_ROOT_DIR="C:\Program Files\OpenSSL"
            OPENSSL_ROOT_DIR="C:\Program Files\OpenSSL" scons target=${{ matrix.target-type }} \
                platform=${{ matrix.target.platform }} \
                arch=$ARCH \
                precision=${{ matrix.float-precision }} \
                use_mbedtls=${{ matrix.use_mbedtls }}
          else

          scons target=${{ matrix.target-type }} \
                platform=${{ matrix.target.platform }} \
                arch=$ARCH \
                precision=${{ matrix.float-precision }} \
                use_mbedtls=${{ matrix.use_mbedtls }}

          fi
          # 10. Cache Save (.scons_cache)
      - name: Save SCons Cache
        uses: ./src/lib/godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/
          cache-name: ${{ matrix.target.platform }}_${{ matrix.target.arch }}_${{ matrix.float-precision }}_${{ matrix.target-type }}

                # Clean up compilation files
      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      # --- Upload artifact ---
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdext-${{ matrix.target.platform }}-${{ matrix.target.arch }}-${{ matrix.target-type }}-${{ matrix.use_mbedtls }}
          path: bin/


  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      # 9.1 下载所有单独的产物
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          pattern: moonlight-gdext-*
          # 关键：此选项确保每个产物被下载到以其名称命名的子文件夹中
          merge-multiple: true 

      # 9.2 重新组织文件结构以符合要求：<final_name>/<artifact_name>/<content>
      - name: Restructure Artifacts
        shell: bash
        run: |
          FINAL_PACKAGE_DIR="final-merged-package"
          mkdir -p "$FINAL_PACKAGE_DIR"
          
          # 遍历所有下载的工件子目录（名称即为工件名）
          for artifact_dir in downloaded-artifacts/*; do
            if [ -d "$artifact_dir" ]; then
              ARTIFACT_NAME=$(basename "$artifact_dir")
              TARGET_SUBDIR="$FINAL_PACKAGE_DIR/$ARTIFACT_NAME"
              
              # 创建目标子目录，即结构中的 --<产物名字>
              mkdir -p "$TARGET_SUBDIR"
              
              # 将工件内容移动到目标子目录。
              # 原始文件结构：downloaded-artifacts/<artifact_name>/<bin/...>
              # 目标文件结构：final-merged-package/<artifact_name>/<bin/...>
              mv "$artifact_dir"/* "$TARGET_SUBDIR"
              echo "Moved $ARTIFACT_NAME contents to $TARGET_SUBDIR"
            fi
          done

      # 9.3 上传最终合并的产物
      - name: Upload Final Merged Artifact
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-gdextension-all # 最终产物名称
          path: final-merged-package/    # 包含所需结构 (moonlight-gdext-*-*/bin/...) 的目录
          # 原始分离的产物不会被删除，因为我们使用的是 actions/upload-artifact@v4，而非 merge action